name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install lxml pytest
      - name: Check skills metadata
        run: ./scripts/install.sh --check
      - name: Run ksef-invoice tests
        run: pytest -v skills/ksef-invoice/tests
